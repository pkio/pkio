# pkio config for opencode

profile: $(PKIO_ROOT)/etc/cmd/opencode/profile.json

read-write:
- ~/.opencode/
- ~/.config/opencode/
- ~/.cache/opencode/
- ~/.local/share/opencode/
- ~/.local/share/opentui/
- ~/.local/state/opencode/
- /tmp
- ~/.cache/makes/

read-only:
- /proc
- /usr/bin
- /usr/local/bin
- /usr/libexec
- /usr/include
- ~/.config/gh
- /etc/gitconfig

# OAuth callback port for /connect codex (redirect to http://localhost:1455)
net:
  ports:
    listen:
    - 1455
