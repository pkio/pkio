--- !ys-0

config-dir =:: ~/.config/pkio/cache/claude
# pkio config for claude

--- !ys:
browser: google-chrome

cmd-args:
- --dangerously-skip-permissions

env:
  CLAUDE_CODE_DISABLE_TERMINAL_TITLE: 1
  CLAUDE_CONFIG_DIR:: config-dir

read-write:
- ! config-dir + '/'
- /tmp
- /tmp/claude-$(shell id -u)
- ~/.cache/makes
- ~/.claude/plugins/

read-only:
- /proc
- /usr/bin
- /usr/local/bin
- /usr/libexec
- /usr/include
- /etc/gitconfig
