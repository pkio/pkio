# pkio config for codex (OpenAI Codex CLI)

profile: codex

env:
  TMPDIR: /tmp
  SQLITE_TMPDIR: /tmp

cmd-args:
- --dangerously-bypass-approvals-and-sandbox
- -c
- tui.terminal_title=[]
- -c
- project_doc_fallback_filenames=[\"CLAUDE.md\"]

makes:
- rg
- node

read-write:
- ~/.codex/
- /tmp
- ~/.cache/makes
- $(PKIO_CACHE)

read-only:
- ~/.config/pkio/cache/claude/CLAUDE.md
- ~/.ssh/known_hosts
- /proc
- /usr/bin
- /usr/local/bin
- /usr/libexec
- /usr/include
- /etc/gitconfig
- /etc/passwd
- /etc/magic
