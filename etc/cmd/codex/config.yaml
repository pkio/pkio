# pkio config for codex (OpenAI Codex CLI)

profile: codex

cmd-args:
- --dangerously-bypass-approvals-and-sandbox
- -c
- tui.terminal_title=[]
- -c
- project_doc_fallback_filenames=[\"CLAUDE.md\"]

makes:
- rg
- node

read-write:
- ~/.codex/
- /tmp
- ~/.cache/makes

read-only:
- /proc
- /usr/bin
- /usr/local/bin
- /usr/libexec
- /usr/include
- ~/.config/gh
- /etc/gitconfig
